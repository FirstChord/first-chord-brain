name: Verify Sheets credential

on:
  workflow_dispatch:
    inputs:
      expected_client_id:
        description: Expected replacement Google OAuth client ID (public identifier)
        required: true
        type: string

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify token refresh and spreadsheet metadata access
        env:
          EXPECTED_CLIENT_ID: ${{ inputs.expected_client_id }}
          SHEETS_CLIENT_ID: ${{ secrets.SHEETS_CLIENT_ID }}
          SHEETS_CLIENT_SECRET: ${{ secrets.SHEETS_CLIENT_SECRET }}
          SHEETS_REFRESH_TOKEN: ${{ secrets.SHEETS_REFRESH_TOKEN }}
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.error, urllib.parse, urllib.request
          try:
              names = ('EXPECTED_CLIENT_ID', 'SHEETS_CLIENT_ID', 'SHEETS_CLIENT_SECRET', 'SHEETS_REFRESH_TOKEN', 'GOOGLE_SPREADSHEET_ID')
              if not all(os.environ.get(n) for n in names):
                  raise ValueError('configuration')
              if os.environ['SHEETS_CLIENT_ID'] != os.environ['EXPECTED_CLIENT_ID']:
                  raise ValueError('client mismatch')
              request = urllib.request.Request(
                  'https://oauth2.googleapis.com/token',
                  data=urllib.parse.urlencode({
                      'client_id': os.environ['SHEETS_CLIENT_ID'],
                      'client_secret': os.environ['SHEETS_CLIENT_SECRET'],
                      'refresh_token': os.environ['SHEETS_REFRESH_TOKEN'],
                      'grant_type': 'refresh_token',
                  }).encode(),
                  headers={'Content-Type': 'application/x-www-form-urlencoded'},
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  grant = json.load(response)
              expected_scopes = {'https://www.googleapis.com/auth/spreadsheets', 'https://www.googleapis.com/auth/drive'}
              if not grant.get('access_token') or set(grant.get('scope', '').split()) != expected_scopes:
                  raise ValueError('scope mismatch')
              url = 'https://sheets.googleapis.com/v4/spreadsheets/' + urllib.parse.quote(os.environ['GOOGLE_SPREADSHEET_ID'], safe='') + '?fields=spreadsheetId'
              request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + grant['access_token']})
              with urllib.request.urlopen(request, timeout=20) as response:
                  if response.status != 200:
                      raise ValueError('metadata read')
              print('Expected client matched; token refresh passed; exact scopes matched; Sheets metadata HTTP 200.')
          except urllib.error.HTTPError as error:
              print('Google credential check failed with HTTP status', error.code)
              sys.exit(1)
          except Exception:
              print('Google credential check failed; no credentials or response data logged.')
              sys.exit(1)
          PY
