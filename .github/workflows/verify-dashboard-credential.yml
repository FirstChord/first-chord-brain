name: Verify dashboard checkout credential

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-checkout:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out private dashboard with Brain credential
        uses: actions/checkout@v7
        with:
          repository: FirstChord/first-chord-dashboard
          token: ${{ secrets.DASHBOARD_REPO_TOKEN }}
          path: dashboard
          fetch-depth: 1
          persist-credentials: false
      - name: Verify registry file is readable
        shell: bash
        run: |
          test -s dashboard/lib/config/students-registry.js
          echo "Read-only private dashboard checkout succeeded"
